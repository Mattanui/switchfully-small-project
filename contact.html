                        </div>

                        <div>
                            <label for="telephone" class="block font-semibold mb-1 text-lg">Phone</label>

                                class="w-full border-2 border-black p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                        <div>
                            <label for="demande" class="block font-semibold mb-1 text-lg">Your request *</label>
                            <textarea id="demande" name="demande" rows="5" required
                                class="w-full border-2 border-black p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
                        </div>

                        <div class="flex justify-end mt-4">
                            <button type="submit"
                                class="border-2 border-black bg-white px-8 py-3 font-bold text-lg hover:bg-gray-200 transition-colors">
